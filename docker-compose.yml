services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: local
    container_name: peoplemanager-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - QUEUE_CONNECTION=database
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-peoplemanager}
      - DB_USERNAME=${DB_USERNAME:-peoplemanager}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - CHROME_PATH=/usr/bin/chromium
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - peoplemanager

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: local
    container_name: peoplemanager-queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --backoff=60 --sleep=3
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - QUEUE_CONNECTION=database
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-peoplemanager}
      - DB_USERNAME=${DB_USERNAME:-peoplemanager}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - peoplemanager

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: local
    container_name: peoplemanager-scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - QUEUE_CONNECTION=database
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-peoplemanager}
      - DB_USERNAME=${DB_USERNAME:-peoplemanager}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - peoplemanager

  nginx:
    image: nginx:1.27-alpine
    container_name: peoplemanager-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - peoplemanager

  mysql:
    image: mariadb:10.11
    container_name: peoplemanager-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: ${DB_DATABASE:-peoplemanager}
      MARIADB_USER: ${DB_USERNAME:-peoplemanager}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$${MARIADB_USER} -p$${MARIADB_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - peoplemanager

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: peoplemanager-phpmyadmin
    profiles: ["debug"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-peoplemanager}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
      UPLOAD_LIMIT: 256M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - peoplemanager

volumes:
  mysql_data:

networks:
  peoplemanager:
    driver: bridge
